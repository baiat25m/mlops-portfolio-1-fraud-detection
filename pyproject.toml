[project]
name = "fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection, taken from raw data to a monitored production service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "pyarrow>=21.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
